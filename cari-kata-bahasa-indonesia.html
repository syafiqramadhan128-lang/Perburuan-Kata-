 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function sfx(k,n){if(k==="s")beep(480+n*45,.07);else if(k==="ok"){[660,830,990].forEach(function(f,i){beep(f,.14,"triangle",i*.08)})}
 else if(k==="bad")beep(160,.15,"square");else if(k==="win"){[523,659,784,1047].forEach(function(f,i){beep(f,.2,"triangle",i*.1)})}else if(k==="lose")[300,240,180].forEach(function(f,i){beep(f,.2,"sawtooth",i*.12)})}

// ---------- papan ----------
function dfs(w,k,r,c,p){
 var id=r*N+c;if(L[id])return false;L[id]=w[k];p.push(id);
 if(k===w.length-1)return true;
 var d=shuffle(DIRS);
 for(var x=0;x<8;x++){var nr=r+d[x][0],nc=c+d[x][1];
  if(nr>=0&&nr<N&&nc>=0&&nc<N&&dfs(w,k+1,nr,nc,p))return true}
 L[id]=null;p.pop();return false;
}
function gen(){
 var cnt=Math.min(1+level,8),ok=false,tries=0;
 while(!ok&&tries++<100){
  L=[];for(var i=0;i<N*N;i++)L[i]=null;gone=[];tgt=[];ok=true;
  var pick=shuffle(W).slice(0,cnt).sort(function(a,b){return b[0].length-a[0].length});
  for(var k=0;k<pick.length&&ok;k++){
   var placed=false;
   for(var a=0;a<60&&!placed;a++){var p=[];placed=dfs(pick[k][0],0,Math.floor(Math.random()*N),Math.floor(Math.random()*N),p);if(placed)tgt.push({w:pick[k][0],c:pick[k][1],p:p,f:false})}
   if(!placed)ok=false;
  }
 }
 for(var j=0;j<N*N;j++){if(!L[j])L[j]=FILL[Math.floor(Math.random()*FILL.length)]}
 tgt=shuffle(tgt);
}
function render(){
 var b=$("board");b.innerHTML="";b.style.gridTemplateColumns="repeat("+N+",1fr)";b.style.gap=(N>8?3:5)+"px";b.style.setProperty("--fs","clamp(11px,"+(48/N).toFixed(1)+"vw,"+Math.round(230/N)+"px)");
 for(var i=0;i<N*N;i++){var t=document.createElement("button");t.className="t";t.id="t"+i;t.textContent=L[i];
  t.setAttribute("aria-label","Huruf "+L[i]+", baris "+(Math.floor(i/N)+1)+", kolom "+(i%N+1));t.dataset.i=i;b.appendChild(t)}
 var u=$("clues");u.innerHTML="";
 tgt.forEach(function(t,i){var li=document.createElement("li");li.id="cl"+i;li.innerHTML='<span></span> <em></em>';
  li.firstChild.textContent=t.c;li.lastChild.textContent="("+t.w.length+" huruf, diawali "+t.w[0]+")";u.appendChild(li)});
 stats();paint();
}
function stats(){
 $("sc").textContent=score;$("lv").textContent=level+"/"+MAXL;$("tm").textContent=mmss(Math.max(0,time));$("cb").textContent="x"+Math.min(Math.max(streak,1),5);
 $("tfill").style.width=Math.max(0,time/total*100)+"%";$("tbar").classList.toggle("low",time<=15&&live);
}
function paint(){
 for(var i=0;i<N*N;i++){var t=$("t"+i);t.className="t"+(gone[i]===true?" g":gone[i]==="b"?" b":"")+(sel.indexOf(i)>=0?" s":"")+(hintId===i?" h":"")}
 $("cur").textContent=sel.map(function(i){return L[i]}).join("");
}
function adj(a,b){return Math.abs(Math.floor(a/N)-Math.floor(b/N))<=1&&Math.abs(a%N-b%N)<=1}
function tap(i,fromDrag){
 if(!live||gone[i])return;lastAct=Date.now();
 var k=sel.indexOf(i);
 if(k>=0){if(k===sel.length-1&&!fromDrag){sel.pop();paint()}else if(fromDrag&&k===sel.length-2){sel.pop();paint()}return}
 if(sel.length&&!adj(sel[sel.length-1],i)){if(!fromDrag){$("msg").textContent="Huruf harus bersebelahan.";sfx("bad");say(pick(BADL),"worry");var e=$("t"+i);e.classList.add("bad");setTimeout(function(){e.classList.remove("bad")},300)}return}
 sel.push(i);sfx("s",sel.length);
 var cur=sel.map(function(x){return L[x]}).join("");
 for(var x=0;x<tgt.length;x++){if(!tgt[x].f&&tgt[x].w===cur){found(x);return}}
 $("msg").textContent="";paint();
}
function found(x){
 var t=tgt[x],now=Date.now();t.f=true;
 streak=(now-lastF<10000)?streak+1:1;lastF=now;var m=Math.min(streak,5),pts=t.w.length*10*level*m;
 var cells=sel.slice();cells.forEach(function(i){gone[i]="b"});sel=[];
 setTimeout(function(){cells.forEach(function(i){gone[i]=true});paint()},350);
 score+=pts;sfx("ok");popup("+"+pts+(m>1?" 🔥x"+m:""));
 var li=$("cl"+x);li.className="done";li.firstChild.textContent="✓ "+t.w+": "+t.c;
 $("msg").textContent="Benar! "+t.w+(m>1?" (kombo x"+m+")":"");var sh=m===1&&Math.random()<.25;say(m>1?"Kombo x"+m+"! Kamu cepat sekali, aku sampai deg-degan!":(sh?pick(SHYL):pick(OKL)),m>1?"cheer":(sh?"shy":"happy"));stats();paint();
 if(tgt.every(function(q){return q.f}))setTimeout(clearLevel,500);
}
function popup(t){var p=document.createElement("div");p.className="pt";p.textContent=t;document.querySelector(".bw").appendChild(p);setTimeout(function(){p.remove()},1000)}
function confetti(){var e=["🎉","✨","⭐","🎊","💙"];for(var i=0;i<36;i++){var c=document.createElement("span");c.className="cf";c.textContent=e[i%5];
 c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(c);(function(c){setTimeout(function(){c.remove()},3500)})(c)}}

// ---------- peringkat ----------
var DB=null,UID=null,LB=[],LOC=[],online=false;
try{LOC=JSON.parse(localStorage.getItem("ck-lb")||"[]");myName=localStorage.getItem("ck-nm")||myName}catch(e){}
async function initLB(){
 try{
  if(typeof claude==="undefined")return;
  var db=await claude.use("db"),us=await claude.use("user");if(!db||!us)return;
  UID=await us.id();if(!UID)return;DB=db;
  db.collection("lb").orderBy("s","desc").limit(50).onSnapshot(function(s){
   LB=s.docs.map(function(d){var x=d.data()||{};return{id:d.id,n:String(x.n||"?").slice(0,12),s:+x.s||0,t:+x.t||0,l:+x.l||0}});online=true;refreshLB()},
   function(){online=false;refreshLB()});
 }catch(e){}
}
function rows(){
 var a=(online?LB:LOC.map(function(x){return{id:"",n:x.n,s:x.s,t:x.t,l:x.l,ts:x.ts}})).slice();
 a.sort(function(p,q){return q.s-p.s||p.t-q.t});return a.slice(0,8);
}
function lbHTML(){
 var r=rows(),h='<p class="src">'+(online?"Peringkat semua pemain":"Peringkat di perangkat ini")+' (urut skor, lalu waktu tercepat)</p><ol class="lb">';
 if(!r.length)return h+'<li style="display:block">Belum ada skor. Jadilah yang pertama!</li></ol>';
 var med=["🥇","🥈","🥉"];
 return h+r.map(function(x,i){var me=online?(UID&&x.id===UID):(lastRec&&x.ts===lastRec.ts);
  return '<li class="'+(me?"me":"")+'"><span>'+(med[i]||(i+1)+".")+'</span><span class="nm"></span><span>'+x.s+' <small>poin</small></span><small>'+mmss(x.t)+'</small></li>'}).join("")+'</ol>';
}
function fillNames(){var r=rows(),n=document.querySelectorAll(".lb .nm");for(var i=0;i<n.length&&i<r.length;i++)n[i].textContent=r[i].n}
function refreshLB(){var b=$("lbbox");if(b){b.innerHTML=lbHTML();fillNames()}}
async function save(){
 lastRec={n:myName,s:score,t:used,l:level,ts:Date.now()};
 LOC.push(lastRec);LOC.sort(function(p,q){return q.s-p.s||p.t-q.t});LOC=LOC.slice(0,10);
 try{localStorage.setItem("ck-lb",JSON.stringify(LOC))}catch(e){}
 if(DB&&UID){try{var ref=DB.doc("lb/"+UID),cur=await ref.get(),o=cur.exists?cur.data():null;
  if(!o||lastRec.s>o.s||(lastRec.s===o.s&&lastRec.t<o.t))await ref.set(lastRec)}catch(e){}}
 refreshLB();
}

// ---------- alur game ----------
function show(o){
 var h=(o.logo?'<div style="margin:0 auto 6px">'+document.querySelector(".lg").outerHTML+'</div>':"")+'<h2>'+o.h+'</h2><p>'+o.t+'</p>';
 if(o.name)h+='<input id="nin" maxlength="12" placeholder="Namamu" aria-label="Namamu" value="">';
 if(o.lb)h+='<div id="lbbox">'+lbHTML()+'</div>';
 h+='<div class="row" style="margin:0"><button id="ob1"></button>'+(o.b2?'<button class="g2" id="ob2"></button>':"")+'</div>';
 $("ovc").innerHTML=h;$("ob1").textContent=o.b;$("ob1").onclick=o.f;
 if(o.b2){$("ob2").textContent=o.b2;$("ob2").onclick=o.f2}
 if(o.name){$("nin").value=myName==="Pemain"?"":myName}
 if(o.lb)fillNames();$("ov").classList.remove("hide");$("ob1").focus();
}
function tick(){time--;used++;stats();if(time<=0){gameOver();return}if(time===15)say("Waktunya tinggal 15 detik! Fokus, kamu pasti bisa!","worry");else if(Date.now()-lastAct>25000&&time>20){say("Bingung? Baca petunjuknya lagi, atau tekan Petunjuk. Pelan-pelan saja ya.","wink");lastAct=Date.now()}}
function begin(){
 $("ov").classList.add("hide");N=Math.min(5+level,10);gen();sel=[];streak=0;total=time=90+tgt.length*25;render();live=true;hintId=-1;
 $("msg").textContent="Papan "+N+"×"+N+" dengan "+tgt.length+" kata. Ketuk atau seret huruf yang bersebelahan.";lastAct=Date.now();say(level===1?"Halo! Aku Necha. Ayo cari kata-katanya bareng-bareng!":"Level "+level+"! Pasti bisa, aku percaya sama kamu!",level===1?"happy":"cheer");
 clearInterval(iv);iv=setInterval(tick,1000);
}
function startNew(){var n=$("nin");if(n){myName=(n.value||"").trim().slice(0,12)||"Pemain";try{localStorage.setItem("ck-nm",myName)}catch(e){}}level=1;score=0;used=0;begin()}
async function win10(bonus){
 say("Kamu menamatkan semua "+MAXL+" level! Aku bangga banget sama kamu!","cheer");
 show({h:"Tamat! 🏆",t:"Kamu menyelesaikan semua "+MAXL+" level! Bonus waktu +"+bonus+". Skor akhir "+score+", total waktu bermain "+mmss(used)+".",lb:true,name:true,b:"Main lagi",f:startNew});
 await save();
}
function clearLevel(){
 live=false;clearInterval(iv);var bonus=Math.max(0,time)*2;score+=bonus;stats();sfx("win");confetti();say("Level selesai! Kamu keren banget, aku bangga!","cheer");if(level>=MAXL){win10(bonus);return}
 show({h:"Level "+level+" selesai! 🎉",t:"Bonus waktu +"+bonus+" poin. Skor kamu "+score+". Level berikutnya: papan "+Math.min(6+level,10)+"×"+Math.min(6+level,10)+" dengan "+Math.min(2+level,8)+" kata.",b:"Level berikutnya",f:function(){level++;begin()}});
}
async function gameOver(){
 live=false;clearInterval(iv);sfx("lose");stats();say("Yah, waktunya habis… tapi kamu sudah berusaha sekuat tenaga. Coba lagi yuk!","sad");
 show({h:"Waktu habis! ⏰",t:"Skor akhir "+score+", sampai level "+level+", total waktu bermain "+mmss(used)+".",lb:true,b:"Main lagi",f:startNew,name:true});
 await save();
}
function pauseRank(){
 if(live){live=false;clearInterval(iv)}
 var resume=total>0&&time>0&&tgt.length&&!tgt.every(function(q){return q.f});
 show({h:"🏆 Peringkat",t:resume?"Permainan dijeda.":"Skor terbaik para pemain.",lb:true,b:resume?"Lanjutkan":"Tutup",f:function(){$("ov").classList.add("hide");if(resume){live=true;clearInterval(iv);iv=setInterval(tick,1000)}}});
}
function hint(){
 if(!live)return;var u=tgt.filter(function(t){return !t.f});if(!u.length)return;
 score=Math.max(0,score-10);var t=u[Math.floor(Math.random()*u.length)];hintId=t.p[0];stats();paint();say("Ini bantuan dariku. Jangan bilang siapa-siapa ya!","shy");
 $("msg").textContent="Kata “"+t.c+"” dimulai dari huruf berbingkai hijau.";
 setTimeout(function(){hintId=-1;paint()},2500);
}
// seret / ketuk
var B=$("board");
function tileXY(x,y){var el=document.elementFromPoint(x,y);el=el&&el.closest?el.closest(".t"):null;return el?+el.dataset.i:-1}
function dstart(x,y){var i=tileXY(x,y);if(i<0)return false;drag=true;tap(i,false);return true}
function dmove(x,y){if(!drag)return;var i=tileXY(x,y);if(i>=0)tap(i,true)}
B.addEventListener("touchstart",function(e){var t=e.touches[0];if(dstart(t.clientX,t.clientY))e.preventDefault()},{passive:false});
B.addEventListener("touchmove",function(e){if(!drag)return;e.preventDefault();var t=e.touches[0];dmove(t.clientX,t.clientY)},{passive:false});
B.addEventListener("touchend",function(){drag=false});B.addEventListener("touchcancel",function(){drag=false});
B.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse")dstart(e.clientX,e.clientY)});
B.addEventListener("pointermove",function(e){if(e.pointerType==="mouse")dmove(e.clientX,e.clientY)});
window.addEventListener("pointerup",function(){drag=false});window.addEventListener("pointercancel",function(){drag=false});
B.addEventListener("click",function(e){if(e.detail===0||e.pointerType===""){var b=e.target.closest(".t");if(b)tap(+b.dataset.i,false)}});
$("clr").onclick=function(){sel=[];paint()};$("hint").onclick=hint;$("rank").onclick=pauseRank;
$("snd").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";this.setAttribute("aria-pressed",!muted)};
show({logo:1,h:"Perburuan Kata",t:"Halo, aku Necha, pembawa acaramu hari ini! 🌸 Temukan kata-kata materi Bahasa Indonesia di papan. Baca petunjuknya, lalu ketuk atau seret huruf yang bersebelahan (termasuk diagonal). Kata yang benar berturut-turut dalam 10 detik memberi kombo hingga x5. Habiskan semua kata sebelum waktu habis. Ada "+MAXL+" level, mampukah kamu menamatkannya?",name:true,lb:true,b:"Mulai",f:startNew});
mood("happy");initLB();
</script>
